<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Alfie Brown</title>
  <link rel="icon" href="/assets/logos/a-logo.svg" type="image/svg+xml">
  <meta name="description" content="Notes from Alfie Brown, a Brighton-based product designer: process, materials and what's on the bench.">
  <link rel="canonical" href="https://alfiebrowndesign.co.uk/blog/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog | Alfie Brown">
  <meta property="og:description" content="Notes from Alfie Brown, a Brighton-based product designer: process, materials and what's on the bench.">
  <meta property="og:url" content="https://alfiebrowndesign.co.uk/blog/">
  <meta property="og:image" content="https://alfiebrowndesign.co.uk/assets/images/general/share-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog | Alfie Brown">
  <meta name="twitter:description" content="Notes from Alfie Brown, a Brighton-based product designer: process, materials and what's on the bench.">
  <meta name="twitter:image" content="https://alfiebrowndesign.co.uk/assets/images/general/share-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/theme-tokens.css">
  <link rel="stylesheet" href="/site-header.css">
  <style>
    /* TODO: confirm Quwela DEMO licence (Ragamkata Studio) allows web use before publishing */
    @font-face {
      font-family: "Quwela";
      src: url("/assets/fonts/quwela-demo-regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    /* Same tokens, header, hero band and footer as the homepage */
    :root { --header-h: 80px; }
    @media (max-width: 720px) { :root { --header-h: 64px; } }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      background: var(--bg-page);
      overflow-x: clip;
    }

    body {
      position: relative;
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--ink-body);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .page-shell {
      display: flex;
      flex-direction: column;
      width: min(1280px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
    }

    .page-shell > main { flex: 1; }

    /* Header: clear over the indigo band, frosted once you scroll */
    .sticky-header {
      background: transparent;
      border-bottom: 1px solid transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: background-color 300ms ease, border-color 300ms ease, box-shadow 300ms ease;
    }

    .sticky-header.is-scrolled {
      background: rgba(31, 31, 31, 0.82);
      border-bottom-color: var(--rule);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .site-header-nav a { color: var(--ink-body); }

    .site-header-nav a:hover,
    .site-header-nav a:focus-visible,
    .site-header-nav a[aria-current="page"] {
      color: var(--ink-strong);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    .site-header-menu-links a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 6px;
    }

    .site-header-menu-panel { transition: opacity 180ms ease, visibility 0s linear 180ms; }
    .site-header-menu-panel.is-open { transition: opacity 180ms ease, visibility 0s; }

    /* Indigo intro band, full bleed like the homepage hero */
    .blog-hero {
      position: relative;
      left: 50%;
      width: 100vw;
      transform: translateX(-50%);
      padding: calc(var(--header-h) + clamp(48px, 9vh, 96px)) 0 clamp(48px, 8vh, 88px);
      background: var(--brand-indigo);
    }

    .blog-hero__inner {
      width: min(1280px, calc(100% - 48px));
      margin: 0 auto;
    }

    .blog-hero h1 {
      margin: 0 0 20px;
      color: var(--accent);
      font-family: "Quwela", var(--font-sans);
      font-size: clamp(3.5rem, 8vw, 6rem);
      font-weight: 400;
      line-height: 0.95;
    }

    .blog-hero p {
      max-width: 60ch;
      color: var(--ink-body);
      font-size: 1.2rem;
      line-height: 1.45;
    }

    /* Posts use the same card pattern as the work grid */
    .posts {
      padding: 54px 0 12px;
    }

    .post-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 34px clamp(28px, 7vw, 66px);
    }

    .post-item {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    .post-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1.6;
      overflow: hidden;
      border-radius: 28px;
      background-color: var(--bg-raised);
    }

    .post-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: scale 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .post-item:hover .post-thumb img,
    .post-item:has(h3 a:focus-visible) .post-thumb img { scale: 1.03; }

    .post-item:has(h3 a:focus-visible) .post-thumb {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    .post-meta {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 14px 0 0;
    }

    .post-tag {
      color: var(--ink-muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .post-meta h3 {
      color: var(--ink-body);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .post-meta h3 a {
      display: inline-block;
      padding-bottom: 0.15em;
      background: linear-gradient(var(--accent), var(--accent)) left bottom / 0% 2px no-repeat;
      transition: background-size 1s cubic-bezier(0.22, 1, 0.36, 1), color 200ms ease;
    }

    .post-meta h3 a::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .post-item:hover .post-meta h3 a,
    .post-meta h3 a:focus-visible {
      background-size: 100% 2px;
      color: var(--accent-text);
      outline: none;
    }

    .post-desc {
      max-width: 60ch;
      color: var(--ink-body);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Shown until the first post goes up */
    .blog-empty {
      display: grid;
      gap: 10px;
      padding: clamp(32px, 6vw, 64px);
      border: 1px solid var(--rule);
      border-radius: 28px;
      background: var(--bg-raised);
    }

    .blog-empty h2 {
      color: var(--accent);
      font-family: "Quwela", var(--font-sans);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 400;
      line-height: 1;
    }

    .blog-empty p {
      color: var(--ink-body);
      font-size: 1rem;
    }

    .blog-empty a {
      color: var(--ink-strong);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .blog-empty a:hover,
    .blog-empty a:focus-visible { color: var(--accent-text); }

    @media (prefers-reduced-motion: reduce) {
      .post-thumb img,
      .post-meta h3 a { transition: none; }
      .post-item:hover .post-thumb img,
      .post-item:has(h3 a:focus-visible) .post-thumb img { scale: 1; }
    }

    @media (max-width: 767px) {
      .post-list { grid-template-columns: minmax(0, 1fr); gap: 2.5rem; }
      .blog-hero p { font-size: 1.05rem; }
    }

    /* Footer, as on the homepage */
    .site-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      width: 100vw;
      padding: 72px max(24px, calc((100vw - 1280px) / 2)) 48px;
      margin: 96px 0 0 calc(50% - 50vw);
      background: var(--brand-indigo);
      color: var(--ink-body);
    }

    .footer-copy { max-width: 560px; }

    .footer-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      color: var(--ink-body);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer-meta .footer-name { text-transform: none; }

    .footer-social {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .instagram-link,
    .linkedin-link,
    .behance-link {
      display: inline-flex;
      padding: 0.5rem;
      color: var(--ink-strong);
      transition: color 0.25s ease, opacity 0.25s ease;
    }

    .instagram-link svg,
    .linkedin-link svg,
    .behance-link img { width: 25px; height: 25px; }

    .behance-link img { filter: brightness(0) invert(1); }
    .behance-link:hover,
    .behance-link:focus-visible { opacity: 0.7; }

    .instagram-link .instagram-gradient { opacity: 0; transition: opacity 0.25s ease; }
    .instagram-link:hover .instagram-gradient,
    .instagram-link:focus-visible .instagram-gradient { opacity: 1; }

    .linkedin-link:hover,
    .linkedin-link:focus-visible { color: #0A66C2; }

    .footer-meta .cv-link {
      padding: 0 0 0 8px;
      color: var(--ink-strong);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }

    .footer-meta .cv-link:hover,
    .footer-meta .cv-link:focus-visible {
      color: var(--ink-strong);
      text-decoration-thickness: 2px;
    }

    @media (max-width: 900px) {
      .site-footer { flex-direction: column; align-items: flex-start; }
      .footer-meta { align-items: flex-start; }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body id="top">
  <div class="page-shell">
    <header class="sticky-header site-header">
      <div class="site-header-brand">
        <a href="/" aria-label="Back to home"><img class="site-header-logo" src="/assets/logos/a-logo.svg" alt="Alfie Brown logo"></a>
        <span>Alfie Brown</span>
      </div>
      <nav class="site-header-nav" aria-label="Main navigation">
        <a href="/#about">About</a>
        <a href="/blog/" aria-current="page">Blog</a>
        <a href="/#work">Work</a>
        <a href="/#contact">Contact</a>
      </nav>
      <button class="site-header-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu-panel">

        <span></span>
        <span></span>
      </button>
    </header>
    <div class="site-header-menu-panel" id="menu-panel" aria-hidden="true">
      <nav class="site-header-menu-links" aria-label="Mobile navigation">
        <a href="/#about">About</a>
        <a href="/blog/" aria-current="page">Blog</a>
        <a href="/#work">Work</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>

    <main>
      <section class="blog-hero" aria-labelledby="blog-title">
        <div class="blog-hero__inner">
          <h1 id="blog-title">Blog</h1>
          <!-- Intro line: swap for Alfie's own text -->
          <p>Notes on process, materials and what's on the bench.</p>
        </div>
      </section>

      <section class="posts" aria-labelledby="posts-title">
        <h2 class="visually-hidden" id="posts-title">Posts</h2>

        <!--
          Posts go in .post-list, newest first. Copy this block for each one:

          <article class="post-item">
            <div class="post-thumb"><img src="/assets/images/blog/POST-IMAGE.webp" alt="DESCRIBE THE IMAGE" loading="lazy"></div>
            <div class="post-meta">
              <p class="post-tag"><time datetime="2026-11-01">1 Nov 2026</time> · Process</p>
              <h3><a href="/blog/POST-SLUG">Post title</a></h3>
              <p class="post-desc">One or two sentences on what the post is about.</p>
            </div>
          </article>

          Remove .blog-empty once the first post is in.
        -->
        <div class="post-list"></div>

        <div class="blog-empty">
          <h2>First post coming soon</h2>
          <p>In the meantime, have a look at my <a href="/#work">work</a>.</p>

    <footer class="site-footer">

      <div class="footer-meta">

          <a class="linkedin-link" href="https://www.linkedin.com/in/alfie-brown-148322386" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4v11H4zM6 3.5a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5zM10 9h3.8v1.6h.05c.53-1 1.83-2 3.77-2 4.03 0 4.78 2.65 4.78 6.1V20h-4v-4.7c0-1.12-.02-2.56-1.56-2.56-1.56 0-1.8 1.22-1.8 2.48V20h-4z"/></svg></a>

        <a href="mailto:alfiebdesign@gmail.com">alfiebdesign@gmail.com</a>
        <span class="footer-name">© 2026 Alfie Brown</span>
      </div>
    </footer>
  </div>

  <script>
    const header = document.querySelector('.sticky-header');
    const menuToggle = document.querySelector('.site-header-menu-toggle');
    const menuPanel = document.getElementById('menu-panel');
    const menuLinks = menuPanel.querySelectorAll('a');

    const syncHeaderState = () => header.classList.toggle('is-scrolled', window.scrollY > 40);
    window.addEventListener('scroll', syncHeaderState, { passive: true });
    syncHeaderState();

    const setMenu = (open, returnFocus = false) => {
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      menuPanel.classList.toggle('is-open', open);
      menuPanel.setAttribute('aria-hidden', String(!open));
      document.body.classList.toggle('site-menu-open', open);
      if (open) menuLinks[0].focus();
      else if (returnFocus) menuToggle.focus();
    };

    menuToggle.addEventListener('click', () => setMenu(menuToggle.getAttribute('aria-expanded') !== 'true'));
    menuLinks.forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') setMenu(false, true);
    });
  </script>
</body>
</html>
