<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Alfie Brown</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="theme-tokens.css">
  <link rel="stylesheet" href="site-header.css">
  <style>
    body { margin: 0; min-height: 100vh; background: var(--bg-page); color: var(--ink-body); font-family: var(--font-sans); }
    .not-found { min-height: 100vh; display: grid; place-content: center; gap: 1.5rem; padding: 120px 1.25rem 2rem; box-sizing: border-box; text-align: center; }
    .not-found h1 { margin: 0; color: var(--ink-strong); font: 900 clamp(3rem, 12vw, 7rem)/0.9 var(--font-display); }
    .not-found p { margin: 0; font-size: 1.1rem; }
    .not-found a { justify-self: center; color: var(--accent-text); text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .not-found a:hover, .not-found a:focus-visible { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="not-found">
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="index.html">Back to home</a>
  </main>
  <script src="site-header.js"></script>
</body>
</html>
